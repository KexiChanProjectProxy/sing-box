name: Release

on:
  push:
    tags:
      - 'v*.*.*.*'

permissions:
  contents: write

jobs:
  extract_changelog:
    name: Extract changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.body }}
      title: ${{ steps.changelog.outputs.title }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Extract changelog
        id: changelog
        run: |
          # Extract changelog for this version
          if [ -f CHANGELOG.md ]; then
            # Extract content between ## [version] and the next ## or end of file
            awk "/## \[$VERSION\]/,/^## / {print} /^## / && !first {first=1; next}" CHANGELOG.md | sed '1d;$d' > /tmp/changelog_body.txt
            BODY=$(cat /tmp/changelog_body.txt)

            # Also get title from the first line
            TITLE=$(grep "^## \[$VERSION\]" CHANGELOG.md | sed "s/## \[$VERSION\] //")

            if [ -z "$BODY" ]; then
              BODY="Release $VERSION"
              TITLE="Release $VERSION"
            fi
          else
            BODY="Release $VERSION"
            TITLE="Release $VERSION"
          fi

          # Save to outputs (escape newlines for GitHub Actions)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "title=$TITLE" >> $GITHUB_OUTPUT

          # Also echo for debugging
          echo "Extracted changelog for $VERSION:"
          echo "$TITLE"
          echo ""
          echo "$BODY"

  build:
    name: Build binary
    runs-on: ubuntu-latest
    needs: extract_changelog
    strategy:
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: windows, arch: amd64 }
          - { os: windows, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25.5

      - name: Extract version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set build tags
        run: |
          TAGS='with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_embedded_tor,with_grpc,with_shadowsocksr'
          echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"

      - name: Build
        run: |
          set -xeuo pipefail
          mkdir -p dist

          OUTPUT_NAME="sing-box-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi

          go build -v -trimpath -o "dist/${OUTPUT_NAME}" \
            -tags "${BUILD_TAGS}" \
            -ldflags "-s -w -buildid= -X github.com/sagernet/sing-box/constant.Version=${VERSION}" \
            ./cmd/sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate checksum
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            sha256sum *.exe > SHA256SUMS.txt
          else
            sha256sum sing-* > SHA256SUMS.txt
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: dist

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs:
      - extract_changelog
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          cd release

          # Create checksums file
          sha256sum * | tee checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          title: ${{ needs.extract_changelog.outputs.title }}
          body: ${{ needs.extract_changelog.outputs.changelog }}
          draft: false
          prerelease: false
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
