# nginx stream configuration for TLS termination
# Place this in /etc/nginx/nginx.conf or include it from there

stream {
    # Upstream AnyTLS server (listening on localhost without TLS)
    upstream anytls {
        server 127.0.0.1:8080;
    }

    # HTTPS server with TLS termination
    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        # TLS certificate configuration
        ssl_certificate /path/to/cert.pem;
        ssl_certificate_key /path/to/key.pem;

        # Modern TLS configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Forward to AnyTLS without TLS
        proxy_pass anytls;
        proxy_ssl off;

        # Optional: increase buffer sizes for better performance
        proxy_buffer_size 16k;
    }
}
